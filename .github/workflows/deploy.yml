name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build all decks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # source dir => output slug
          build_deck() {
            local src="$1"
            local slug="$2"
            echo "::group::Build $slug ($src)"
            pushd "$src" > /dev/null
            npm ci
            npm run build
            popd > /dev/null
            mkdir -p "_site/$slug"
            cp -R "$src/dist/." "_site/$slug/"
            echo "::endgroup::"
          }

          build_deck "ai-engineer-bootcamp-05/Context Engineering"           "context-engineering"
          build_deck "ai-engineer-bootcamp-05/The Four Prototyping Patterns" "four-prototyping-patterns"
          build_deck "ai-engineer-bootcamp-05/Vibe Coding"                   "vibe-coding"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
